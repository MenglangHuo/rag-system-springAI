# ==============================================================================
# Cambodia Labour Law RAG Service — Application Configuration
# ==============================================================================

server:
  port: ${SERVER_PORT:8090}
  servlet:
    context-path: /

spring:
  application:
    name: rag-question-service

  # ======================== Database ========================
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:54325/rag_question}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # ======================== Spring AI ========================
  ai:
    openai:
      # API key — required by the OpenAI client, used by Ollama Cloud for auth
      api-key: ${OPENAI_API_KEY:5baabc0cb89d4a719c11b663b7addc0b.VI3CGEawK0LiIwCRrzWXevE6}

      # Point to Ollama's OpenAI-compatible endpoint
      base-url: ${OPENAI_BASE_URL:http://localhost:11434}

      chat:
        options:
          model: ${CHAT_MODEL:gemma4:31b-cloud}
          temperature: 0.3

      embedding:
        options:
          model: ${EMBEDDING_MODEL:nomic-embed-text}

    # ======================== PgVector Store ========================
    vectorstore:
      pgvector:
        initialize-schema: true
        distance-type: COSINE_DISTANCE
        dimensions: 768
        table-name: vector_store
        index-type: HNSW

    retry:
      max-attempts: 3
      backoff:
        initial-interval: 1000
        multiplier: 2.0
        max-interval: 10000

# ======================== Actuator ========================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# ======================== Logging ========================
logging:
  level:
    root: INFO
    bronx.caspearl.rag: INFO
    org.springframework.ai: INFO
    org.springframework.retry: DEBUG

# ======================== OpenAPI / Swagger ========================
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

# ======================== Resilience4j ========================
resilience4j:
  circuitbreaker:
    instances:
      llmService:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        slow-call-duration-threshold: 30s
        slow-call-rate-threshold: 80
  retry:
    instances:
      llmService:
        max-attempts: 3
        wait-duration: 2s
        retry-exceptions:
          - java.net.ConnectException
          - java.net.SocketTimeoutException
          - org.springframework.web.client.ResourceAccessException
app:
  keepalive:
    enabled: true